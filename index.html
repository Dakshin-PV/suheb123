
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Student Data Portal</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f5f9;
    color: #1e293b;
}

header {
    background: #173b70;
    color: white;
    padding: 24px 6%;
}

header h1 {
    margin-bottom: 8px;
    font-size: 27px;
}

header p {
    color: #dbeafe;
}

.container {
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 20px;
}

.search-box {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
}

.search-box input {
    flex: 1;
    padding: 14px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 16px;
    outline-color: #2563eb;
}

.search-box button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 14px 22px;
    border-radius: 8px;
    cursor: pointer;
}

.search-box button:hover {
    background: #1d4ed8;
}

.section-title {
    margin: 25px 0 15px;
    font-size: 21px;
}

.student-card {
    background: white;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 3px 12px #0000000a;
    margin-bottom: 22px;
}

.student-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.student-heading h2 {
    color: #173b70;
    margin-bottom: 7px;
}

.badge {
    background: #dcfce7;
    color: #166534;
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 13px;
}

.info-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.info-box {
    background: #f8fafc;
    padding: 17px;
    border-radius: 9px;
    border: 1px solid #e2e8f0;
}

.info-box p {
    color: #64748b;
    font-size: 13px;
    margin-bottom: 9px;
}

.info-box h3 {
    color: #173b70;
    font-size: 23px;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    min-width: 600px;
}

th, td {
    padding: 13px;
    border-bottom: 1px solid #e2e8f0;
    text-align: left;
}

th {
    background: #eaf1fb;
    color: #173b70;
}

.table-wrapper {
    overflow-x: auto;
    border-radius: 9px;
    margin-bottom: 24px;
}

.timetable th, .timetable td {
    text-align: center;
}

.no-result {
    display: none;
    background: white;
    padding: 25px;
    text-align: center;
    border-radius: 10px;
    color: #dc2626;
}

footer {
    text-align: center;
    padding: 24px;
    color: #64748b;
    font-size: 14px;
}

@media (max-width: 800px) {
    .info-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 480px) {
    header h1 {
        font-size: 22px;
    }

    .info-grid {
        grid-template-columns: 1fr 1fr;
        gap: 9px;
    }

    .info-box {
        padding: 12px;
    }

    .info-box h3 {
        font-size: 19px;
    }

    .search-box button {
        padding: 12px;
    }

    .student-card {
        padding: 16px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Student Data Portal</h1>
    <p>Attendance | Marks | Timetable | Academic Performance</p>
</header>

<div class="container">

    <h2 class="section-title">Search Student</h2>

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Enter student name or USN..."
            oninput="searchStudent()"
            aria-label="Search students by name or USN"
        >
        <button onclick="searchStudent()">Search</button>
    </div>

    <div id="noResult" class="no-result">
        No student found. Please check the name or USN.
    </div>

    <div id="studentDetails"></div>

</div>

<footer>
    Student Data Portal | Academic Dashboard
</footer>

<script>
// Sample data for five students
const students = [
    {
        name: "Salman Khan",
        usn: "4SN23CS001",
        department: "Computer Science",
        semester: 5,
        attendance: 92,
        sgpa: 9.1,
        cgpa: 8.8,
        subjects: [
            {name:"Data Structures", internal:27, external:62, lab:45},
            {name:"Database Systems", internal:25, external:60, lab:46},
            {name:"Operating Systems", internal:28, external:65, lab:44},
            {name:"Computer Networks", internal:26, external:58, lab:43}
        ]
    },
    {
        name: "Allu Arjun",
        usn: "4SN23CS002",
        department: "Computer Science",
        semester: 5,
        attendance: 88,
        sgpa: 8.7,
        cgpa: 8.5,
        subjects: [
            {name:"Data Structures", internal:25, external:59, lab:44},
            {name:"Database Systems", internal:28, external:64, lab:47},
            {name:"Operating Systems", internal:26, external:61, lab:45},
            {name:"Computer Networks", internal:24, external:57, lab:42}
        ]
    },
    {
        name: "Yash",
        usn: "4SN23CS003",
        department: "Computer Science",
        semester: 5,
        attendance: 79,
        sgpa: 7.8,
        cgpa: 7.6,
        subjects: [
            {name:"Data Structures", internal:22, external:54, lab:40},
            {name:"Database Systems", internal:24, external:56, lab:42},
            {name:"Operating Systems", internal:23, external:58, lab:41},
            {name:"Computer Networks", internal:21, external:52, lab:39}
        ]
    },
    {
        name: "ShahRukh Khan",
        usn: "4SN23CS004",
        department: "Computer Science",
        semester: 5,
        attendance: 95,
        sgpa: 9.4,
        cgpa: 9.2,
        subjects: [
            {name:"Data Structures", internal:29, external:68, lab:48},
            {name:"Database Systems", internal:28, external:66, lab:49},
            {name:"Operating Systems", internal:30, external:69, lab:48},
            {name:"Computer Networks", internal:27, external:65, lab:47}
        ]
    },
    {
        name: "Darshan",
        usn: "4SN23CS005",
        department: "Computer Science",
        semester: 5,
        attendance: 84,
        sgpa: 8.2,
        cgpa: 8.0,
        subjects: [
            {name:"Data Structures", internal:24, external:57, lab:42},
            {name:"Database Systems", internal:26, external:59, lab:44},
            {name:"Operating Systems", internal:25, external:60, lab:43},
            {name:"Computer Networks", internal:23, external:55, lab:41}
        ]
    }
];

// Common weekly timetable for the sample class
const timetable = [
    ["Monday", "Data Structures", "Database Systems",
        "Operating Systems", "Computer Networks"],
    ["Tuesday", "Database Systems", "Data Structures",
        "Computer Networks", "Operating Systems"],
    ["Wednesday", "Operating Systems", "Computer Networks",
        "Data Structures", "Database Systems"],
    ["Thursday", "Computer Networks", "Operating Systems",
        "Database Systems", "Data Structures"],
    ["Friday", "Data Structures Lab", "Data Structures Lab",
        "Database Lab", "Database Lab"]
];

function searchStudent() {
    const query = document.getElementById("searchInput")
        .value.trim().toLowerCase();

    const results = students.filter(student =>
        student.name.toLowerCase().includes(query) ||
        student.usn.toLowerCase().includes(query)
    );

    const details = document.getElementById("studentDetails");
    const noResult = document.getElementById("noResult");

    if (results.length === 0) {
        details.innerHTML = "";
        noResult.style.display = "block";
        return;
    }

    noResult.style.display = "none";

    details.innerHTML = results.map(student => `
        <section class="student-card">
            <div class="student-heading">
                <div>
                    <h2>${student.name}</h2>
                    <p>USN: ${student.usn}</p>
                    <p>${student.department} | Semester ${student.semester}</p>
                </div>
                <span class="badge">Student Record</span>
            </div>

            <div class="info-grid">
                <div class="info-box">
                    <p>Attendance</p>
                    <h3>${student.attendance}%</h3>
                </div>
                <div class="info-box">
                    <p>Current SGPA</p>
                    <h3>${student.sgpa}</h3>
                </div>
                <div class="info-box">
                    <p>Overall CGPA</p>
                    <h3>${student.cgpa}</h3>
                </div>
                <div class="info-box">
                    <p>Subjects</p>
                    <h3>${student.subjects.length}</h3>
                </div>
            </div>

            <h3 class="section-title">Subject-wise Marks</h3>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Subject</th>
                            <th>Internal (30)</th>
                            <th>External (70)</th>
                            <th>Lab (50)</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${student.subjects.map(subject => `
                            <tr>
                                <td>${subject.name}</td>
                                <td>${subject.internal}</td>
                                <td>${subject.external}</td>
                                <td>${subject.lab}</td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            </div>

            <h3 class="section-title">Weekly Timetable</h3>

            <div class="table-wrapper">
                <table class="timetable">
                    <thead>
                        <tr>
                            <th>Day</th>
                            <th>9–10 AM</th>
                            <th>10–11 AM</th>
                            <th>11:30–12:30 PM</th>
                            <th>1:30–2:30 PM</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${timetable.map(day => `
                            <tr>
                                ${day.map(item => `<td>${item}</td>`).join("")}
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            </div>
        </section>
    `).join("");
}

// Show all five sample records when the page first opens
searchStudent();
</script>

</body>
</html>
